<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">ChurnCue mark</title>
  <desc id="desc">A customer retention pulse inside a secure rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="18" y1="16" x2="142" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B36"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="signal" x1="38" y1="45" x2="126" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#surface)" stroke="#263653" stroke-width="3"/>
  <circle cx="80" cy="80" r="47" fill="none" stroke="#243453" stroke-width="9"/>
  <path d="M33 82h23l9-23 16 47 14-36 9 12h23" fill="none" stroke="url(#signal)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="127" cy="82" r="6" fill="#22D3EE"/>
</svg>
