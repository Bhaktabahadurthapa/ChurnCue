services:
  churncue-mcp:
    build: .
    ports:
      - "${CHURNCUE_PUBLISHED_PORT:-8000}:8000"
    environment:
      CHURNCUE_HOST: 0.0.0.0
      CHURNCUE_PORT: 8000
      CHURNCUE_DATABASE_PATH: /app/state/churncue.db
      CHURNCUE_ARTIFACT_DIR: /app/data/artifacts
      CHURNCUE_DEMO_DATA_PATH: /app/data/demo/customer_churn_demo.csv
      CHURNCUE_LOG_LEVEL: INFO
    volumes:
      - churncue-db:/app/state
      - churncue-artifacts:/app/data/artifacts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  churncue-db:
  churncue-artifacts:
