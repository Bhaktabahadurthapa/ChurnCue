services:
  clientrevive-mcp:
    build: .
    ports:
      - "${CLIENTREVIVE_PUBLISHED_PORT:-8000}:8000"
    environment:
      CLIENTREVIVE_HOST: 0.0.0.0
      CLIENTREVIVE_PORT: 8000
      CLIENTREVIVE_DATABASE_PATH: /app/state/clientrevive.db
      CLIENTREVIVE_ARTIFACT_DIR: /app/data/artifacts
      CLIENTREVIVE_DEMO_DATA_PATH: /app/data/demo/customer_churn_demo.csv
      CLIENTREVIVE_LOG_LEVEL: INFO
    volumes:
      - clientrevive-db:/app/state
      - clientrevive-artifacts:/app/data/artifacts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  clientrevive-db:
  clientrevive-artifacts:
