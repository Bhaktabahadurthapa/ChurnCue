name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify generated demo data
        run: |
          python scripts/generate_demo_data.py
          git diff --exit-code -- data/demo/customer_churn_demo.csv

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test with coverage
        run: pytest

      - name: Verify wheel metadata and CLI
        run: |
          python -m pip install --no-deps --force-reinstall .
          python -c "import churncue; assert churncue.__version__ == '1.0.0'"

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: churncue:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
